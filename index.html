<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crypto Coach">
<title>Crypto Coach — Signals, Research & Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- Desktop sidebar -->
  <aside class="sidebar">
    <div class="logo"><div class="mark">🪙</div><div>Crypto Coach<small>Spot · Practice mode</small></div></div>
    <nav class="nav" id="sideNav">
      <button data-page="home"><span class="ic">🏠</span>Home</button>
      <button data-page="coins"><span class="ic">🔎</span>Find Coins</button>
      <button data-page="trades"><span class="ic">💼</span>My Trades</button>
      <button data-page="calc"><span class="ic">🧮</span>Calculator</button>
      <button data-page="learn"><span class="ic">📘</span>Learn</button>
      <button data-page="settings"><span class="ic">⚙️</span>Settings</button>
    </nav>
    <div class="sideFoot">
      <div class="syncPill" onclick="go('settings')"><span class="dot" id="syncDot"></span><span id="syncText">Checking login…</span></div>
      <div class="muted" style="font-size:11.5px;padding:0 6px" id="dataTime">Loading prices…</div>
    </div>
  </aside>

  <main class="main">
    <!-- Desktop top bar -->
    <div class="topbar">
      <h1 id="pageH1">Home</h1>
      <div class="grow"></div>
      <button class="btn ghost sm" onclick="openSearch()">🔎 Search any coin</button>
      <button class="btn ghost sm" onclick="refreshAll(true)">↻ Refresh</button>
    </div>

    <!-- Mobile top bar -->
    <div class="mobileTop">
      <div class="logo"><div class="mark">🪙</div>Crypto Coach</div>
      <div class="grow"></div>
      <button class="iconBtn" onclick="openSearch()" aria-label="Search">🔎</button>
      <button class="iconBtn" onclick="go('settings')" aria-label="Account and settings" id="mAccountBtn">👤</button>
    </div>
    <div class="pageTitle" id="pageTitleM">Home</div>

    <section id="page-home"></section>
    <section id="page-coins" class="hidden"></section>
    <section id="page-trades" class="hidden"></section>
    <section id="page-calc" class="hidden"></section>
    <section id="page-learn" class="hidden"></section>
    <section id="page-settings" class="hidden"></section>

    <p class="muted" style="font-size:12px;margin-top:30px">
      Prices from CoinGecko. Signals are simple rules, not financial advice — no profit is guaranteed. "Halal" tags only come from your own list.
      This app is in <b>practice mode</b>: no real money is used.
    </p>
  </main>

  <!-- Mobile bottom tabs -->
  <nav class="tabbar" id="tabNav">
    <button data-page="home"><span class="ic">🏠</span>Home</button>
    <button data-page="coins"><span class="ic">🔎</span>Coins</button>
    <button data-page="trades"><span class="ic">💼</span>Trades</button>
    <button data-page="calc"><span class="ic">🧮</span>Calculator</button>
    <button data-page="learn"><span class="ic">📘</span>Learn</button>
  </nav>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="core.js"></script>
<script src="report.js"></script>
<script src="pages.js"></script>
<script src="calculator.js"></script>
<script src="cloud.js"></script>
<script>startApp();</script>
</body>
</html>
